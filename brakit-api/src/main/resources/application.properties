quarkus.datasource.db-kind=${DB_KIND:}
# Connection settings only apply to prod; dev uses application-dev.properties and tests use Dev Services
%prod.quarkus.datasource.username=${DB_USERNAME:}
%prod.quarkus.datasource.password=${DB_PASSWORD:}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL:}

# Schema is owned by Flyway migrations (src/main/resources/db/migration)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.initial-size=5

# SQL Logging (useful for debugging Panache active record / repository queries)
# quarkus.hibernate-orm.log.sql=true
# quarkus.hibernate-orm.log.format-sql=true

# JWT: tokens are signed with the private key and verified with the public key
mp.jwt.verify.issuer=brakit-api
smallrye.jwt.new-token.issuer=brakit-api
# Token lifespan in seconds (12 hours)
smallrye.jwt.new-token.lifespan=43200
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:}
